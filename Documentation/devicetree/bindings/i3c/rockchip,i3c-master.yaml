%YAML 1.2
---
$id: http://devicetree.org/schemas/i3c/rockchip,i3c-master.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip I3C master block

maintainers:
  - David Wu <david.wu@rock-chips.com>

description: |
  The Rockchip I3C master controller provides an I3C bus interface
  compliant with the MIPI I3C specification.

allOf:
  - $ref: i3c.yaml#

properties:
  compatible:
    const: rockchip,i3c-master

  reg:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: hclk
      - const: i3c

  interrupts:
    maxItems: 1

  dmas:
    maxItems: 2

  dma-names:
    items:
      - const: rx
      - const: tx

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: i3c
      - const: ahb

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/rockchip,rk3576-cru.h>
    #include <dt-bindings/reset/rockchip,rk3576-cru.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    i3c0: i3c@2abe0000 {
      compatible = "rockchip,i3c-master";
      reg = <0x2abe0000 0x1000>;
      interrupts = <GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>;
      #address-cells = <3>;
      #size-cells = <0>;
      clocks = <&cru HCLK_I3C0>, <&cru CLK_I3C0>;
      clock-names = "hclk", "i3c";
      dmas = <&dmac0 22>, <&dmac0 23>;
      dma-names = "rx", "tx";
      resets = <&cru SRST_I3C0>, <&cru SRST_H_I3C0>;
      reset-names = "i3c", "ahb";
    };
