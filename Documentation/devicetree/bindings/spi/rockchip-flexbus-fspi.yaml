%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/rockchip-flexbus-fspi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip Flexbus controller under SPI transmission protocol

maintainers:
  - Heiko Stuebner <heiko@sntech.de>
  - Jon Lin <jon.lin@rock-chips.com>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: rockchip,flexbus-fspi
    description:
      The rockchip flexbus controller is a standalone IP with version register,
      and the driver can handle all the feature difference inside the IP
      depending on the version register.

  fspi-cs-gpios:
    description:
      Specifies the gpio pins to be used for chipselects. The gpios will be
      referred to as reg = <index> in the SPI child nodes. If unspecified, a
      single SPI device without a chip select can be used.

  reset-gpios:
    description:
      Specifies the reset gpio pin to be used for resetting the devices.

patternProperties:
  "^flash@[0-3]$":
    type: object
    properties:
      reg:
        minimum: 0
        maximum: 3

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/pinctrl/rockchip.h>

    flexbus_fspi: spi {
        compatible = "rockchip,flexbus-fspi";
        fspi-cs-gpios = <&gpio4 RK_PB0 GPIO_ACTIVE_LOW>, <&gpio4 RK_PA5 GPIO_ACTIVE_LOW>;
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "jedec,spi-nor";
            reg = <0>;
            spi-max-frequency = <108000000>;
            spi-rx-bus-width = <1>;
            spi-tx-bus-width = <4>;
        };
    };

...
