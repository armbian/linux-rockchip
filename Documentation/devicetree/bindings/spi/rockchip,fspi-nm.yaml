%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/rockchip,fspi-nm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip Flexible Serial Peripheral Interface Normal Mode (FSPI NM)

maintainers:
  - Heiko Stuebner <heiko@sntech.de>
  - Chris Morgan <macromorgan@hotmail.com>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    enum:
      - rockchip,fspi-nm

    description:
      The rockchip flexible serial peripheral interface(FSPI) is a standalone
      IP with version register, and the driver can handle all the feature
      difference inside the IP depending on the version register.

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Bus Clock
      - description: Module Clock

  clock-names:
    items:
      - const: clk_sfc
      - const: hclk_sfc

  power-domains:
    maxItems: 1

  rockchip,fspi-no-dma:
    description: Disable DMA and utilize FIFO mode only
    type: boolean

  rockchip,sclk-x2-bypass:
    description:
      Turn off the internal 2 frequency division logic of the controller clock,
      and the interface clock is 1:1 with the controller working clock.
    type: boolean

  rockchip,max-dll:
    description:
      Setting maximum dll cell.
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    fspi: spi@ff3a0000 {
        compatible = "rockchip,fspi-nm";
        reg = <0xff3a0000 0x4000>;
        interrupts = <GIC_SPI 56 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cru SCLK_SFC>, <&cru HCLK_SFC>;
        clock-names = "clk_sfc", "hclk_sfc";
        pinctrl-0 = <&fspim2_pins>;
        pinctrl-names = "default";
        power-domains = <&power PX30_PD_MMC_NAND>;
        #address-cells = <1>;
        #size-cells = <0>;

        spidev@0 {
            compatible = "rockchip,spidev";
            reg = <0>;
            spi-max-frequency = <80000000>;
            spi-rx-bus-width = <4>;
            spi-tx-bus-width = <4>;
        };
    };

...
