%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/rockchip,rk3588-hdptx-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip SoC HDMI/eDP Transmitter Combo PHY

maintainers:
  - Cristian Ciocaltea <cristian.ciocaltea@collabora.com>

properties:
  compatible:
    enum:
      - rockchip,rk3588-hdptx-phy

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Reference clock
      - description: APB clock

  clock-names:
    items:
      - const: ref
      - const: apb

  "#clock-cells":
    const: 0

  "#phy-cells":
    const: 0

  resets:
    items:
      - description: PHY reset line
      - description: APB reset line
      - description: INIT reset line
      - description: CMN reset line
      - description: LANE reset line
      - description: ROPLL reset line
      - description: LCPLL reset line

  reset-names:
    items:
      - const: phy
      - const: apb
      - const: init
      - const: cmn
      - const: lane
      - const: ropll
      - const: lcpll

  rockchip,grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Some PHY related data is accessed through GRF regs.

  rockchip,phy-table:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      Optional TMDS and FRL lane tuning table. Each entry contains a link rate, 5 raw register
      values for lane 3, and 5 shared by lanes 0 through 2. Lane 3 is the TMDS clock lane or the
      fourth FRL data lane. Register order is 0303 swing, 0304 de-emphasis, 0305 pre-shoot, 0306
      drive current, and 0307 acceleration-driver control and polarity; override and polarity bits
      are ignored. Entries must be sorted by ascending rate. Rates up to 600 MHz select TMDS mode
      and higher rates select FRL mode; the first same-mode entry not below the requested rate is
      used. Each entry is packed as an 8-byte big-endian rate followed by 10 register bytes, so
      the total property length must be a multiple of 18 bytes. Define the rate with "/bits/ 64"
      and the register values with "/bits/ 8". If absent, the driver uses its default settings.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#phy-cells"
  - resets
  - reset-names
  - rockchip,grf

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/rockchip,rk3588-cru.h>
    #include <dt-bindings/reset/rockchip,rk3588-cru.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      phy@fed60000 {
        compatible = "rockchip,rk3588-hdptx-phy";
        reg = <0x0 0xfed60000 0x0 0x2000>;
        clocks = <&cru CLK_USB2PHY_HDPTXRXPHY_REF>, <&cru PCLK_HDPTX0>;
        clock-names = "ref", "apb";
        #phy-cells = <0>;
        resets = <&cru SRST_HDPTX0>, <&cru SRST_P_HDPTX0>,
                 <&cru SRST_HDPTX0_INIT>, <&cru SRST_HDPTX0_CMN>,
                 <&cru SRST_HDPTX0_LANE>, <&cru SRST_HDPTX0_ROPLL>,
                 <&cru SRST_HDPTX0_LCPLL>;
        reset-names = "phy", "apb", "init", "cmn", "lane", "ropll", "lcpll";
        rockchip,grf = <&hdptxphy_grf>;
        rockchip,phy-table =
          /bits/ 64 <165000000>,
          /bits/ 8 <0x2f 0x03 0x03 0x1d 0x08 0x2f 0x03 0x03 0x1d 0x08>,
          /bits/ 64 <340000000>,
          /bits/ 8 <0x2f 0x03 0x03 0x1d 0x08 0x2f 0x03 0x03 0x1d 0x08>,
          /bits/ 64 <600000000>,
          /bits/ 8 <0x2f 0x03 0x03 0x1d 0x08 0x2f 0x03 0x03 0x1d 0x08>,
          /bits/ 64 <4800000000>,
          /bits/ 8 <0x2f 0x14 0x4f 0xfc 0x08 0x2f 0x14 0x4f 0xfc 0x08>;
      };
    };
