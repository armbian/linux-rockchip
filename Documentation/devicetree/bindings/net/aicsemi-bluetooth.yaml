%YAML 1.2
---
$id: http://devicetree.org/schemas/net/aicsemi-bluetooth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AICsemi AIC8800 Bluetooth

maintainers:
  - Artem Butusov <art.sormy@gmail.com>

description:
  AIC8800 is a combo WiFi + Bluetooth chip. The WiFi side is attached over
  SDIO, the Bluetooth side over a serial port, where it speaks plain H4. The
  controller needs no firmware upload on this transport - the SDIO side brings
  the chip up - so the serial side is an ordinary H4 attachment.

properties:
  compatible:
    const: aicsemi,aic8800-bt

  max-speed: true

required:
  - compatible

additionalProperties: false

examples:
  - |
    serial {
        bluetooth {
            compatible = "aicsemi,aic8800-bt";
            max-speed = <1500000>;
        };
    };
